# Support mikroservizining O'Z alembic zanjiri (asosiy loyihaning `alembic.ini`
# siga aloqasi yo'q — boshqa baza, boshqa versiya jadvali).
#
#   alembic -c support_service/alembic.ini upgrade head
#
# Ulanish manzili `SUPPORT_DB_URL` muhit o'zgaruvchisidan olinadi (env.py).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
