# Chat mikroservizining O'Z alembic zanjiri (asosiy loyihaning `alembic.ini` /
# `migrations/` idan alohida — boshqa baza, boshqa versiya jadvali).
#
#   alembic -c chat_service/alembic.ini upgrade head
#   alembic -c chat_service/alembic.ini revision --autogenerate -m "..."
#
# Baza manzili `CHAT_DB_URL` dan olinadi (migrations/env.py).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
version_table = chat_alembic_version

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
